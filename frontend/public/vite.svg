  />

  <!-- Right angle -->
  <path
    d="M302 160 L352 256 L302 352"
    fill="none"
    stroke="url(#dtCore)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle connection dot -->
  <circle cx="256" cy="256" r="8" fill="#ffffff88"/>
