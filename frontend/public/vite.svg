<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dtCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c7a"/>
      <stop offset="100%" stop-color="#6a3cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0e0e17"/>

  <!-- Left angle -->
  <path
    d="M210 160 L160 256 L210 352"
    fill="none"
    stroke="url(#dtCore)"
    stroke-width="28"
    stroke-linecap="round"
